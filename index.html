<!DOCTYPE html>

<head>

  <title>Evan Liu</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>

  <div class="layout">

    <!-- Left sidebar: name + nav -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <p class="site-label">Portfolio</p>
        <h1 class="site-name">Evan<br /><span class="accent">Liu</span></h1>
      </div>

      <nav class="page-nav">
        <a class="nav-btn active" href="work.html">Work</a>
      </nav>

      <div class="sidebar-bottom">
        <span class="copyright">&copy; 2026 Evan Liu</span>
        <span class="last-updated">Last updated June 2026</span>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div class="home-content">
        <div class="home-text">
          <p class="eyebrow">Welcome</p>
          <h2 class="home-headline">Turning geographic<br />data into <span class="accent">meaningful<br />spatial stories.</span></h2>
          <p class="home-desc">I work at the intersection of geography and technology — building maps, models, and analyses that help people understand complex spatial relationships.</p>
          <a class="cta-btn" href="work.html">View My Work</a>
        </div>

        <div class="home-visual">

            <defs>
              <radialGradient id="hub-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#df5f08" stop-opacity="0.14"/>
                <stop offset="100%" stop-color="#df5f08" stop-opacity="0"/>
              </radialGradient>
            </defs>

            <!-- Background grid -->
            <line x1="0" y1="40"  x2="400" y2="40"  stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="0" y1="80"  x2="400" y2="80"  stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="0" y1="120" x2="400" y2="120" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="0" y1="160" x2="400" y2="160" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>

            <line x1="40"  y1="0" x2="40"  y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="80"  y1="0" x2="80"  y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="120" y1="0" x2="120" y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="160" y1="0" x2="160" y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="200" y1="0" x2="200" y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>
            <line x1="240" y1="0" x2="240" y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>

            <line x1="360" y1="0" x2="360" y2="400" stroke="#f0a868" stroke-width="0.75" opacity="0.35"/>

            <!-- Glow behind main interchange -->
            <circle cx="200" cy="200" r="58" fill="url(#hub-glow)"/>

            <!-- Line 4: Peach — lower cross-line (draw first/behind) -->
            <polyline points="25,308 90,308 130,268 200,268 272,268 355,268"
              fill="none" stroke="#f0a060" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Line 1: Dark Brown — east-west with diagonal entry -->
            <polyline points="25,268 80,268 130,268 200,200 278,200 370,200"
              fill="none" stroke="#7a3010" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Line 3: Amber — diagonal NW–SE -->

              fill="none" stroke="#c06820" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Line 2: Burnt Orange — north-south spine (drawn on top) -->

              fill="none" stroke="#df5f08" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Regular stations — Line 1 -->
            <circle cx="25"  cy="268" r="4"   fill="#fef2e8" stroke="#7a3010" stroke-width="2"/>
            <circle cx="80"  cy="268" r="3.5" fill="#fef2e8" stroke="#7a3010" stroke-width="2"/>

            <circle cx="370" cy="200" r="4"   fill="#fef2e8" stroke="#7a3010" stroke-width="2"/>

            <circle cx="200" cy="144" r="3.5" fill="#fef2e8" stroke="#df5f08" stroke-width="2"/>

            <circle cx="148" cy="368" r="4"   fill="#fef2e8" stroke="#df5f08" stroke-width="2"/>

            <!-- Regular stations — Line 3 -->
            <circle cx="32"  cy="62"  r="4"   fill="#fef2e8" stroke="#c06820" stroke-width="2"/>
            <circle cx="88"  cy="118" r="3.5" fill="#fef2e8" stroke="#c06820" stroke-width="2"/>
            <circle cx="148" cy="164" r="3.5" fill="#fef2e8" stroke="#c06820" stroke-width="2"/>
            <circle cx="262" cy="254" r="3.5" fill="#fef2e8" stroke="#c06820" stroke-width="2"/>
            <circle cx="324" cy="318" r="3.5" fill="#fef2e8" stroke="#c06820" stroke-width="2"/>
            <circle cx="364" cy="358" r="4"   fill="#fef2e8" stroke="#c06820" stroke-width="2"/>

            <!-- Regular stations — Line 4 -->
            <circle cx="25"  cy="308" r="4"   fill="#fef2e8" stroke="#f0a060" stroke-width="2"/>
            <circle cx="90"  cy="308" r="3.5" fill="#fef2e8" stroke="#f0a060" stroke-width="2"/>
            <circle cx="272" cy="268" r="3.5" fill="#fef2e8" stroke="#f0a060" stroke-width="2"/>
            <circle cx="355" cy="268" r="4"   fill="#fef2e8" stroke="#f0a060" stroke-width="2"/>

            <!-- Transfer station: Lines 1 & 4 at (130, 268) -->
            <circle cx="130" cy="268" r="7.5" fill="#fef2e8" stroke="#3a1808" stroke-width="2"/>

            <!-- Transfer station: Lines 2 & 4 at (200, 268) -->
            <circle cx="200" cy="268" r="7.5" fill="#fef2e8" stroke="#3a1808" stroke-width="2"/>

            <!-- Main interchange hub: Lines 1, 2, 3 at (200, 200) -->

            <text x="42" y="364" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#7a3c18">Line 2</text>
            <text x="42" y="376" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#7a3c18">Line 3</text>
            <text x="42" y="388" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#7a3c18">Line 4</text>
